<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Story Toons - AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        :root {
            --bg: #ffffff;
            --surface: #f5f7fa;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --primary: #6366f1;
            --secondary: #8b5cf6;
        }
        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --border: #334155;
        }
        body {
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s;
        }
        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #6366f1;
        }
        .btn {
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 70vh;
        }
        .hero {
            text-align: center;
            padding: 3rem;
            background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.05));
            border-radius: 30px;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .tool-card {
            background: var(--card);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid var(--border);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
        }
        .tool-card .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .tool-area {
            background: var(--card);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid var(--border);
        }
        textarea, input {
            width: 100%;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            margin: 1rem 0;
        }
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
        }
        .result-area {
            margin-top: 1.5rem;
            text-align: center;
        }
        .result-img, .result-video {
            max-width: 100%;
            border-radius: 16px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card);
            border-radius: 24px;
            padding: 2rem;
            max-width: 350px;
            width: 90%;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #6366f1;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-light);
        }
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-2 { margin-top: 1rem; }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; }
            .hero h1 { font-size: 1.8rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo"><i class="fas fa-film"></i> Urdu Story Toons</div>
    <div class="nav-links">
        <a onclick="showPage('home')">Home</a>
        <a onclick="showPage('tools')">Tools</a>
        <a onclick="showPage('dashboard')">Dashboard</a>
        <a onclick="showPage('about')">About</a>
        <button class="btn" id="authBtn" onclick="toggleAuth()">Sign In</button>
        <button class="btn" onclick="toggleTheme()">🌓</button>
    </div>
</div>

<div class="container" id="appContainer"></div>

<footer>
    <p>© 2026 Urdu Story Toons - Free AI Tools</p>
</footer>

<div id="authModal" class="modal">
    <div class="modal-content">
        <h3>Sign In</h3>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="text" id="loginName" placeholder="Your Name">
        <button class="btn btn-primary" onclick="loginUser()">Sign In / Sign Up</button>
        <button class="btn" onclick="closeAuthModal()">Cancel</button>
    </div>
</div>

<div id="loadingDiv" class="loading">
    <div class="spinner"></div>
    <p id="loadingText" style="margin-top:1rem">Processing...</p>
</div>

<script>
    // Data
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    let users = JSON.parse(localStorage.getItem('users') || '[]');
    let history = JSON.parse(localStorage.getItem('history') || '[]');
    let currentPage = 'home';
    let activeTool = null;
    let uploadedImage = null;

    // Helper
    function saveData() {
        localStorage.setItem('users', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        localStorage.setItem('history', JSON.stringify(history));
    }

    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    function showLoading(text) {
        document.getElementById('loadingText').innerText = text;
        document.getElementById('loadingDiv').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('loadingDiv').style.display = 'none';
    }

    // Auth
    function toggleAuth() {
        if(currentUser) {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateAuthUI();
            showPage('home');
        } else {
            openAuthModal();
        }
    }

    function openAuthModal() {
        document.getElementById('authModal').style.display = 'flex';
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
    }

    function loginUser() {
        const email = document.getElementById('loginEmail').value.trim();
        const name = document.getElementById('loginName').value.trim();
        if(!email) { alert('Enter email'); return; }
        
        let user = users.find(u => u.email === email);
        if(!user) {
            user = { email, name: name || email.split('@')[0], joined: new Date().toISOString() };
            users.push(user);
        }
        currentUser = user;
        saveData();
        updateAuthUI();
        closeAuthModal();
        showPage('dashboard');
    }

    function updateAuthUI() {
        const btn = document.getElementById('authBtn');
        if(currentUser) {
            btn.innerHTML = `👤 ${currentUser.name.substring(0, 12)} | Logout`;
        } else {
            btn.innerHTML = 'Sign In';
        }
    }

    // Render Pages
    function showPage(page) {
        currentPage = page;
        activeTool = null;
        render();
    }

    function openTool(tool) {
        if(!currentUser) { alert('Please sign in first'); openAuthModal(); return; }
        activeTool = tool;
        currentPage = 'tool';
        render();
    }

    function render() {
        const container = document.getElementById('appContainer');
        if(currentPage === 'home') container.innerHTML = renderHome();
        else if(currentPage === 'tools') container.innerHTML = renderTools();
        else if(currentPage === 'dashboard') container.innerHTML = renderDashboard();
        else if(currentPage === 'about') container.innerHTML = renderAbout();
        else if(currentPage === 'tool' && activeTool === 'text2image') container.innerHTML = renderTextToImage();
        else if(currentPage === 'tool' && activeTool === 'image2video') container.innerHTML = renderImageToVideo();
        else container.innerHTML = renderHome();
        
        // Re-attach tool functions after render
        if(currentPage === 'tool') {
            if(activeTool === 'text2image') attachTextToImageEvents();
            else if(activeTool === 'image2video') attachImageToVideoEvents();
        }
    }

    function renderHome() {
        return `
            <div class="hero">
                <h1>Welcome to <span style="color:#6366f1">Urdu Story Toons</span></h1>
                <p>Create stunning images and videos using AI - 100% Free</p>
            </div>
            <div class="tools-grid">
                <div class="tool-card" onclick="openTool('text2image')">
                    <div class="icon">🎨</div>
                    <h3>Text to Image</h3>
                    <p>Generate images from text prompts</p>
                </div>
                <div class="tool-card" onclick="openTool('image2video')">
                    <div class="icon">🎬</div>
                    <h3>Image to Video</h3>
                    <p>Upload image + prompt = animated video</p>
                </div>
            </div>
        `;
    }

    function renderTools() {
        return `
            <h2>AI Tools</h2>
            <div class="tools-grid">
                <div class="tool-card" onclick="openTool('text2image')">
                    <div class="icon">🎨</div>
                    <h3>Text to Image</h3>
                </div>
                <div class="tool-card" onclick="openTool('image2video')">
                    <div class="icon">🎬</div>
                    <h3>Image to Video</h3>
                </div>
            </div>
        `;
    }

    function renderDashboard() {
        if(!currentUser) return `<div class="hero"><p>Please sign in</p><button class="btn btn-primary" onclick="openAuthModal()">Sign In</button></div>`;
        const userHistory = history.filter(h => h.userEmail === currentUser.email);
        return `
            <h2>Dashboard</h2>
            <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; margin:1.5rem 0">
                <div class="tool-card" style="padding:1rem"><h3>📸 ${userHistory.filter(h=>h.type==='image').length}</h3><p>Images</p></div>
                <div class="tool-card" style="padding:1rem"><h3>🎬 ${userHistory.filter(h=>h.type==='video').length}</h3><p>Videos</p></div>
            </div>
            <h3>Recent</h3>
            ${userHistory.slice(0,5).map(h => `<div style="background:var(--surface); padding:0.8rem; border-radius:16px; margin-bottom:0.5rem"><b>${h.tool}</b><br><small>${h.prompt?.substring(0,50) || ''}</small></div>`).join('') || '<p>No history</p>'}
        `;
    }

    function renderAbout() {
        return `<div class="hero"><h2>About</h2><p>Free AI platform for Urdu creators</p><p>YouTube: @urdustorytoons007</p></div>`;
    }

    function renderTextToImage() {
        return `
            <div class="tool-area">
                <div class="flex-between"><h2>🎨 Text to Image</h2><button class="btn" onclick="showPage('tools')">← Back</button></div>
                <textarea id="imgPrompt" rows="3" placeholder="Describe your image... Example: beautiful mountain sunset, cinematic"></textarea>
                <button class="btn btn-primary" id="generateImageBtn">✨ Generate Image</button>
                <div class="result-area" id="imgResult"></div>
            </div>
        `;
    }

    function renderImageToVideo() {
        return `
            <div class="tool-area">
                <div class="flex-between"><h2>🎬 Image to Video</h2><button class="btn" onclick="showPage('tools')">← Back</button></div>
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt fa-2x"></i><br>Click to upload image
                </div>
                <input type="file" id="videoImageFile" accept="image/*" style="display:none">
                <div id="videoPreviewArea"></div>
                <textarea id="videoPrompt" rows="3" placeholder="Describe motion... Example: slow cinematic zoom in"></textarea>
                <button class="btn btn-primary" id="generateVideoBtn">🎥 Generate 6-Second Video</button>
                <div class="result-area" id="videoResult"></div>
            </div>
        `;
    }

    // Text to Image Function
    function attachTextToImageEvents() {
        const btn = document.getElementById('generateImageBtn');
        if(btn) {
            btn.onclick = async function() {
                const prompt = document.getElementById('imgPrompt').value;
                if(!prompt) { alert('Enter a prompt'); return; }
                showLoading('Generating image...');
                try {
                    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
                    const resultDiv = document.getElementById('imgResult');
                    resultDiv.innerHTML = `<img src="${url}" class="result-img" style="max-width:100%; border-radius:16px;"><br><button class="btn" onclick="window.open('${url}','_blank')">Download</button>`;
                    
                    history.unshift({ type: 'image', tool: 'Text to Image', prompt, url, userEmail: currentUser.email, date: new Date().toISOString() });
                    history = history.slice(0, 50);
                    localStorage.setItem('history', JSON.stringify(history));
                    hideLoading();
                } catch(e) { hideLoading(); alert('Error: ' + e.message); }
            };
        }
    }

    // Image to Video Functions
    function attachImageToVideoEvents() {
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('videoImageFile');
        if(uploadArea) {
            uploadArea.onclick = () => fileInput.click();
        }
        if(fileInput) {
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        uploadedImage = ev.target.result;
                        document.getElementById('videoPreviewArea').innerHTML = `<img src="${uploadedImage}" style="max-width:100%; border-radius:16px;"><p>✅ Image ready</p>`;
                    };
                    reader.readAsDataURL(file);
                }
            };
        }
        
        const genBtn = document.getElementById('generateVideoBtn');
        if(genBtn) {
            genBtn.onclick = async function() {
                const prompt = document.getElementById('videoPrompt').value;
                if(!uploadedImage) { alert('Upload image first'); return; }
                if(!prompt) { alert('Enter motion description'); return; }
                showLoading('Creating video...');
                
                try {
                    const img = new Image();
                    img.src = uploadedImage;
                    await new Promise(r => { img.onload = r; });
                    
                    const canvas = document.createElement('canvas');
                    const w = 1024, h = 576;
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    
                    let drawW, drawH, startX, startY;
                    if(img.width / img.height > w / h) {
                        drawH = h;
                        drawW = img.width * (h / img.height);
                        startX = (w - drawW) / 2;
                        startY = 0;
                    } else {
                        drawW = w;
                        drawH = img.height * (w / img.width);
                        startX = 0;
                        startY = (h - drawH) / 2;
                    }
                    
                    const stream = canvas.captureStream(24);
                    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    let chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        document.getElementById('videoResult').innerHTML = `
                            <video src="${url}" controls autoplay loop style="max-width:100%; border-radius:16px;"></video>
                            <button class="btn" onclick="downloadVideo('${url}')">Download</button>
                        `;
                        history.unshift({ type: 'video', tool: 'Image to Video', prompt, url, userEmail: currentUser.email, date: new Date().toISOString() });
                        localStorage.setItem('history', JSON.stringify(history.slice(0, 50)));
                        hideLoading();
                    };
                    recorder.start();
                    
                    const du
