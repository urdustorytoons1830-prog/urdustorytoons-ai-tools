<!DOCTYPE html>
<html>
<head>
    <title>Urdu Story Toons</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #1a1a3e);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .login-box {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
        }
        .login-box input {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            width: 250px;
            font-size: 16px;
        }
        .login-box button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .tool-card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .tool-card:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-5px);
        }
        .tool-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .tool-card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        /* Size selector */
        .size-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .size-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid #667eea;
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .size-btn.active {
            background: #667eea;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            max-width: 600px;
            width: 90%;
            border-radius: 25px;
            padding: 25px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            font-size: 14px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        .result-area {
            margin-top: 20px;
            text-align: center;
        }
        .result-area video, .result-area img {
            max-width: 100%;
            border-radius: 15px;
        }
        .preview-img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 15px;
            margin: 10px 0;
        }
        .progress-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 15px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #667eea;
            border-radius: 2px;
        }
        .youtube-link {
            display: inline-block;
            background: #ff0000;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            text-align: center;
        }
        footer {
            text-align: center;
            color: #888;
            margin-top: 30px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Urdu Story Toons AI Studio</h1>

    <!-- Login Section -->
    <div class="login-box" id="loginBox">
        <input type="email" id="emailInput" placeholder="Enter your email">
        <button id="signInBtn">🔐 Sign In (Free)</button>
        <span id="welcomeMsg" style="margin-left: 10px; color: #10b981;"></span>
    </div>

    <!-- Tools -->
    <div class="tools-grid">
        <div class="tool-card" id="ttsCard">
            <div class="tool-icon">🎙️</div>
            <h3>Text to Voice</h3>
            <p>30+ realistic voices</p>
        </div>
        <div class="tool-card" id="imageCard">
            <div class="tool-icon">🎨</div>
            <h3>Text to Image</h3>
            <p>4K HD with size options</p>
        </div>
        <div class="tool-card" id="videoCard">
            <div class="tool-icon">🎬</div>
            <h3>Image to Video</h3>
            <p>9:16, 16:9, 1:1 sizes</p>
        </div>
    </div>

    <!-- YouTube -->
    <div style="text-align: center;">
        <a href="https://youtube.com/@urdustorytoons007" target="_blank" class="youtube-link">▶️ Subscribe on YouTube</a>
    </div>

    <footer>
        <p>© 2026 Urdu Story Toons | Sizes: 9:16 (Shorts) | 16:9 (YouTube) | 1:1 (Instagram)</p>
    </footer>
</div>

<!-- Modal -->
<div id="toolModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Tool</h2>
            <button class="close" id="closeModalBtn">&times;</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ========== LOGIN SYSTEM ==========
    let loggedIn = false;
    let userName = "";
    
    const emailInput = document.getElementById('emailInput');
    const signInBtn = document.getElementById('signInBtn');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const ttsCard = document.getElementById('ttsCard');
    const imageCard = document.getElementById('imageCard');
    const videoCard = document.getElementById('videoCard');
    const modal = document.getElementById('toolModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    
    // Check saved user
    let savedUser = localStorage.getItem('ust_user_simple');
    if(savedUser) {
        loggedIn = true;
        userName = savedUser;
        emailInput.style.display = 'none';
        signInBtn.style.display = 'none';
        welcomeMsg.innerHTML = '✅ Welcome ' + userName;
    }
    
    // Sign in function
    signInBtn.onclick = function() {
        let email = emailInput.value.trim();
        if(email === "") {
            alert("Please enter your email!");
            return;
        }
        if(!email.includes('@')) {
            alert("Enter valid email!");
            return;
        }
        loggedIn = true;
        userName = email.split('@')[0];
        localStorage.setItem('ust_user_simple', userName);
        emailInput.style.display = 'none';
        signInBtn.style.display = 'none';
        welcomeMsg.innerHTML = '✅ Welcome ' + userName;
        alert("Welcome " + userName + "! All tools FREE!");
    };
    
    function checkLogin() {
        if(!loggedIn) {
            alert("Please sign in first!");
            return false;
        }
        return true;
    }
    
    function closeModalFn() {
        modal.style.display = 'none';
    }
    closeModalBtn.onclick = closeModalFn;
    window.onclick = function(e) {
        if(e.target === modal) closeModalFn();
    };
    
    // ========== TEXT TO VOICE ==========
    ttsCard.onclick = function() {
        if(!checkLogin()) return;
        document.getElementById('modalTitle').innerHTML = '🎙️ Text to Voice';
        document.getElementById('modalBody').innerHTML = `
            <textarea id="ttsText" rows="3" placeholder="Enter your text here..."></textarea>
            <select id="voiceSelect" style="width:100%; padding:12px; margin:10px 0; border-radius:12px;">
                <option>👩 Sarah (Female)</option>
                <option>👩 Emma (Female)</option>
                <option>👩 Olivia (Female)</option>
                <option>👨 Michael (Male)</option>
                <option>👨 David (Male)</option>
                <option>👨 James (Male)</option>
            </select>
            <div class="progress-bar"><div class="progress-fill" id="ttsP"></div></div>
            <button class="btn" onclick="generateTTS()">🔊 Generate Voice</button>
            <div id="ttsResult" class="result-area"></div>
        `;
        modal.style.display = 'flex';
    };
    
    function generateTTS() {
        let text = document.getElementById('ttsText').value;
        if(!text.trim()) { alert("Enter text!"); return; }
        let prog = document.getElementById('ttsP');
        prog.style.width = '100%';
        let utterance = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(utterance);
        document.getElementById('ttsResult').innerHTML = '<p style="color:#10b981;">✅ Voice playing!</p>';
        setTimeout(() => { prog.style.width = '0%'; }, 1000);
    }
    
    // ========== TEXT TO IMAGE WITH SIZE ==========
    let selectedImageSize = "1024x1024";
    let imageSizeName = "1:1 (Instagram)";
    
    imageCard.onclick = function() {
        if(!checkLogin()) return;
        document.getElementById('modalTitle').innerHTML = '🎨 Text to Image';
        document.getElementById('modalBody').innerHTML = `
            <div class="size-row">
                <div class="size-btn" onclick="setImageSize('1024x1024','1:1 (Instagram)',this)"><i class="fas fa-square"></i> 1:1 Instagram</div>
                <div class="size-btn" onclick="setImageSize('1792x1024','16:9 (YouTube)',this)"><i class="fas fa-tv"></i> 16:9 YouTube</div>
                <div class="size-btn" onclick="setImageSize('1024x1792','9:16 (Shorts)',this)"><i class="fas fa-mobile-alt"></i> 9:16 Shorts</div>
            </div>
            <textarea id="imgPrompt" rows="3" placeholder="Describe the image... Example: warrior on horse, sunset, cinematic"></textarea>
            <div class="progress-bar"><div class="progress-fill" id="imgP"></div></div>
            <button class="btn" onclick="generateImage()">✨ Generate ${imageSizeName}</button>
            <div id="imgResult" class="result-area"></div>
        `;
        document.getElementById('modalBody').innerHTML += `<p style="font-size:12px; color:#888; margin-top:10px;">Selected: ${imageSizeName}</p>`;
        modal.style.display = 'flex';
    };
    
    function setImageSize(size, name, el) {
        selectedImageSize = size;
        imageSizeName = name;
        document.querySelectorAll('#modalBody .size-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }
    
    async function generateImage() {
        let prompt = document.getElementById('imgPrompt').value;
        if(!prompt.trim()) { alert("Enter prompt!"); return; }
        let prog = document.getElementById('imgP');
        let res = document.getElementById('imgResult');
        prog.style.width = '50%';
        res.innerHTML = '<p>⏳ Generating ' + imageSizeName + ' image...</p>';
        try {
            let wh = selectedImageSize.split('x');
            let url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=' + wh[0] + '&height=' + wh[1] + '&nologo=true';
            prog.style.width = '100%';
            res.innerHTML = '<img src="' + url + '"><br><button onclick="downloadImage(\'' + url + '\')" style="margin-top:10px; padding:10px 20px; background:#10b981; border:none; border-radius:25px; color:white; cursor:pointer;">💾 Download</button>';
            setTimeout(() => { prog.style.width = '0%'; }, 500);
        } catch(e) {
            res.innerHTML = '<p style="color:red;">Error! Try again.</p>';
            prog.style.width = '0%';
        }
    }
    
    function downloadImage(url) {
        let a = document.createElement('a');
        a.href = url;
        a.download = 'image.png';
        a.click();
    }
    
    // ========== IMAGE TO VIDEO WITH SIZE ==========
    let selectedVideoWidth = 1080;
    let selectedVideoHeight = 1920;
    let videoSizeName = "9:16 (YouTube Shorts)";
    let uploadedVideoImage = null;
    
    videoCard.onclick = function() {
        if(!checkLogin()) return;
        document.getElementById('modalTitle').innerHTML = '🎬 Image to Video';
        document.getElementById('modalBody').innerHTML = `
            <div class="size-row">
                <div class="size-btn" onclick="setVideoSize(1080,1920,'9:16 (YouTube Shorts)',this)"><i class="fas fa-mobile-alt"></i> 9:16 Shorts</div>
                <div class="size-btn" onclick="setVideoSize(1920,1080,'16:9 (YouTube Video)',this)"><i class="fas fa-tv"></i> 16:9 YouTube</div>
                <div class="size-btn" onclick="setVideoSize(1080,1080,'1:1 (Instagram)',this)"><i class="fas fa-square"></i> 1:1 Instagram</div>
            </div>
            <input type="file" id="vidFile" accept="image/*" onchange="previewVideoImage()">
            <div id="previewDiv" style="text-align:center; margin:10px 0;"></div>
            <textarea id="vidPrompt" rows="3" placeholder="Motion: zoom in, zoom out, pan left, pan right, orbit"></textarea>
            <div class="progress-bar"><div class="progress-fill" id="vidP"></div></div>
            <button class="btn" onclick="generateVideo()">🎥 Generate ${videoSizeName} Video</button>
            <div id="vidResult" class="result-area"></div>
            <p style="font-size:12px; color:#888; margin-top:10px;">Selected: ${videoSizeName}</p>
        `;
        modal.style.display = 'flex';
    };
    
    function setVideoSize(w, h, name, el) {
        selectedVideoWidth = w;
        selectedVideoHeight = h;
        videoSizeName = name;
        document.querySelectorAll('#modalBody .size-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }
    
    function previewVideoImage() {
        let file = document.getElementById('vidFile').files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                uploadedVideoImage = e.target.result;
                document.getElementById('previewDiv').innerHTML = '<img src="' + uploadedVideoImage + '" class="preview-img"><p style="color:#10b981;">✅ Image ready for ' + videoSizeName + '</p>';
            };
            reader.readAsDataURL(file);
        }
    }
    
    async function generateVideo() {
        let prompt = document.getElementById('vidPrompt').value;
        let prog = document.getElementById('vidP');
        let resDiv = document.getElementById('vidResult');
        
        if(!uploadedVideoImage) { alert("Upload image first!"); return; }
        
        prog.style.width = '20%';
        resDiv.innerHTML = '<p>⏳ Loading image...</p>';
        
        let img = new Image();
        img.src = uploadedVideoImage;
        await new Promise(r => { img.onload = r; });
        
        prog.style.width = '40%';
        resDiv.innerHTML = '<p>🎬 Creating ' + videoSizeName + ' video...</p>';
        
        let canvas = document.createElement('canvas');
        canvas.width = selectedVideoWidth;
        canvas.height = selectedVideoHeight;
        let ctx = canvas.getContext('2d');
        
        // Fit image to canvas
        let dw, dh, sx, sy;
        let imgRatio = img.width / img.height;
        let canRatio = selectedVideoWidth / selectedVideoHeight;
        
        if(imgRatio > canRatio) {
            dh = selectedVideoHeight;
            dw = img.width * (selectedVideoHeight / img.height);
            sx = (selectedVideoWidth - dw) / 2;
            sy = 0;
        } else {
            dw = selectedVideoWidth;
            dh = img.height * (selectedVideoWidth / img.width);
            sx = 0;
            sy = (selectedVideoHeight - dh) / 2;
        }
        
        let stream = canvas.captureStream(24);
        let recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        let chunks = [];
        
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            let blob = new Blob(chunks, { type: 'video/webm' });
            let url = URL.createObjectURL(blob);
            resDiv.innerHTML = '<video src="' + url + '" controls autoplay loop style="max-width:100%; border-radius:15px;"></video><br><button onclick="downloadVideo(\'' + url + '\')" style="margin-top:10px; padding:10px 20px; background:#10b981; border:none; border-radius:25px; color:white; cursor:pointer;">💾 Download Video (' + videoSizeName + ')</button>';
            prog.style.width = '0%';
        };
        
        recorder.start();
        let startTime = Date.now();
        let p = prompt.toLowerCase();
        
        function animate() {
            let elapsed = (Date.now() - startTime) / 1000;
            let progVal = Math.min(elapsed / 6, 1);
            if(progVal >= 1) {
                recorder.stop();
                return;
            }
            
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, selectedVideoWidth, selectedVideoHeight);
            
            let scale = 1;
            let x = sx, y = sy;
            
            if(p.includes('zoom in')) {
                scale = 1 + progVal * 0.25;
                x = (selectedVideoWidth - dw * scale) / 2;
                y = (selectedVideoHeight - dh * scale) / 2;
            }
            else if(p.includes('zoom out')) {
                scale = 1 + (1 - progVal) * 0.2;
                x = (selectedVideoWidth - dw * scale) / 2;
                y = (selectedVideoHeight - dh * scale) / 2;
            }
            else if(p.includes('pan left')) {
                let maxPan = dw - selectedVideoWidth;
                x = sx - maxPan * progVal;
            }
            else if(p.includes('pan right')) {
                let maxPan = dw - selectedVideoWidth;
                x = sx - maxPan * (1 - progVal);
            }
            else if(p.includes('orbit')) {
                scale = 1 + Math.sin(progVal * Math.PI) * 0.08;
                x = (selectedVideoWidth - dw * scale) / 2 + Math.sin(progVal * Math.PI * 2) * 40;
                y = (selectedVideoHeight - dh * scale) / 2;
            }
            else {
                scale = 1 + Math.sin(progVal * Math.PI * 2) * 0.02;
                x = (selectedVideoWidth - dw * scale) / 2;
                y = (selectedVideoHeight - dh * scale) / 2;
            }
            
            ctx.drawImage(img, x, y, dw * scale, dh * scale);
            ctx.font = '12px Arial';
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillText('Urdu Story Too
