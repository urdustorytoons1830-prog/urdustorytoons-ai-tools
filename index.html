<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Urdu Story Toons - AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg: #ffffff;
            --surface: #f5f7fb;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #6c757d;
            --border: #e5e7eb;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
        }

        body.dark {
            --bg: #0f0f1a;
            --surface: #1a1a2e;
            --card: #1e1e2f;
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --border: #2d2d44;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s ease;
        }

        .navbar {
            position: sticky;
            top: 0;
            backdrop-filter: blur(16px);
            background: rgba(var(--bg-rgb, 15, 15, 26), 0.8);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #6366f1;
        }

        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0.4rem 1rem;
            cursor: pointer;
        }

        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px #6366f1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.05));
            border-radius: 40px;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .tool-card {
            background: var(--card);
            border-radius: 28px;
            padding: 2rem;
            border: 1px solid var(--border);
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
        }

        .tool-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .tool-area {
            background: var(--card);
            border-radius: 28px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin-top: 2rem;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: #6366f1;
            background: rgba(99,102,241,0.05);
        }

        textarea, input {
            width: 100%;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font-size: 1rem;
            margin: 1rem 0;
        }

        .result-area {
            margin-top: 1.5rem;
            text-align: center;
        }

        .result-img, .result-video {
            max-width: 100%;
            border-radius: 20px;
            margin-top: 1rem;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: var(--card);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid var(--border);
        }

        .history-item {
            background: var(--surface);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card);
            border-radius: 28px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #6366f1;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 250px;
            height: 5px;
            background: var(--border);
            border-radius: 10px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
            color: var(--text-light);
        }

        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-2 { gap: 1rem; }
        .mt-2 { margin-top: 1rem; }
        .text-center { text-align: center; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; text-align: center; }
            .hero h1 { font-size: 1.8rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo"><i class="fas fa-film"></i> Urdu Story Toons</div>
    <div class="nav-links">
        <a onclick="showPage('home')" id="navHome">Home</a>
        <a onclick="showPage('tools')" id="navTools">Tools</a>
        <a onclick="showPage('dashboard')" id="navDashboard">Dashboard</a>
        <a onclick="showPage('about')">About</a>
        <div class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-sun"></i> 🌙</div>
        <button class="btn" id="authBtn" onclick="openAuthModal()">Sign In</button>
    </div>
</div>

<div class="container" id="appContainer"></div>

<footer>
    <p>© 2026 Urdu Story Toons - Free AI Tools | Made with ❤️</p>
</footer>

<div id="authModal" class="modal">
    <div class="modal-content">
        <h3>Sign In with Email</h3>
        <input type="email" id="loginEmail" placeholder="your@email.com">
        <input type="text" id="loginName" placeholder="Your Name">
        <button class="btn btn-primary" onclick="loginUser()">Sign In / Sign Up</button>
        <button class="btn" onclick="closeAuthModal()">Cancel</button>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p id="loadingText">Processing...</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script>
    // ---------- DATA ----------
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    let users = JSON.parse(localStorage.getItem('users') || '[]');
    let history = JSON.parse(localStorage.getItem('history') || '[]');
    let currentPage = 'home';
    let uploadedImageData = null;

    // ---------- INIT ----------
    function init() {
        updateAuthUI();
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        render();
    }

    function updateAuthUI() {
        const btn = document.getElementById('authBtn');
        if(currentUser) {
            btn.innerHTML = `👤 ${currentUser.name.substring(0, 15)}`;
            btn.onclick = () => logout();
        } else {
            btn.innerHTML = 'Sign In';
            btn.onclick = () => openAuthModal();
        }
    }

    function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

    function loginUser() {
        const email = document.getElementById('loginEmail').value.trim();
        const name = document.getElementById('loginName').value.trim();
        if(!email) { alert('Enter email'); return; }
        
        let user = users.find(u => u.email === email);
        if(!user) {
            user = { email, name: name || email.split('@')[0], joined: new Date().toISOString() };
            users.push(user);
            localStorage.setItem('users', JSON.stringify(users));
        }
        currentUser = user;
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        updateAuthUI();
        closeAuthModal();
        render();
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        updateAuthUI();
        showPage('home');
    }

    // ---------- RENDER ----------
    function render() {
        const container = document.getElementById('appContainer');
        if(currentPage === 'home') container.innerHTML = renderHome();
        else if(currentPage === 'tools') container.innerHTML = renderTools();
        else if(currentPage === 'dashboard') container.innerHTML = renderDashboard();
        else if(currentPage === 'about') container.innerHTML = renderAbout();
        else if(currentPage === 'tool') container.innerHTML = renderTool();
    }

    function renderHome() {
        return `
            <div class="hero">
                <h1>Welcome to <span style="background:linear-gradient(135deg,#6366f1,#8b5cf6); -webkit-background-clip:text; background-clip:text; color:transparent;">Urdu Story Toons</span></h1>
                <p>Turn your imagination into stunning images and videos using AI</p>
            </div>
            <div class="tools-grid">
                <div class="tool-card" onclick="openTool('text2image')">
                    <div class="tool-icon">🎨</div>
                    <h3>Text to Image</h3>
                    <p>Generate beautiful images from text prompts</p>
                </div>
                <div class="tool-card" onclick="openTool('image2video')">
                    <div class="tool-icon">🎬</div>
                    <h3>Image to Video</h3>
                    <p>Upload image + prompt = animated video</p>
                </div>
            </div>
        `;
    }

    function renderTools() {
        return `
            <h2>AI Tools Studio</h2>
            <div class="tools-grid">
                <div class="tool-card" onclick="openTool('text2image')">
                    <div class="tool-icon">🎨</div>
                    <h3>Text to Image</h3>
                    <p>Generate images from prompts</p>
                </div>
                <div class="tool-card" onclick="openTool('image2video')">
                    <div class="tool-icon">🎬</div>
                    <h3>Image to Video</h3>
                    <p>Create 6-second animations</p>
                </div>
            </div>
        `;
    }

    function renderDashboard() {
        if(!currentUser) return `<div class="hero"><p>Please sign in to view dashboard</p><button class="btn btn-primary" onclick="openAuthModal()">Sign In</button></div>`;
        
        const userHistory = history.filter(h => h.userEmail === currentUser.email);
        const imagesCount = userHistory.filter(h => h.type === 'image').length;
        const videosCount = userHistory.filter(h => h.type === 'video').length;
        
        return `
            <h2>Your Dashboard</h2>
            <div class="dashboard-stats">
                <div class="stat-card"><i class="fas fa-images"></i><h3>${imagesCount}</h3><p>Images Generated</p></div>
                <div class="stat-card"><i class="fas fa-video"></i><h3>${videosCount}</h3><p>Videos Created</p></div>
                <div class="stat-card"><i class="fas fa-calendar"></i><h3>${currentUser.joined ? new Date(currentUser.joined).toLocaleDateString() : 'Today'}</h3><p>Member Since</p></div>
            </div>
            <h3>Recent Activity</h3>
            <div id="historyList">
                ${userHistory.slice(0, 10).map(h => `
                    <div class="history-item">
                        <div><strong>${h.tool}</strong><br><small>${new Date(h.date).toLocaleString()}</small></div>
                        <div>${(h.prompt || '').substring(0, 40)}</div>
                        ${h.url ? `<button class="btn" onclick="window.open('${h.url}', '_blank')">View</button>` : ''}
                    </div>
                `).join('') || '<p>No history yet. Try creating something!</p>'}
            </div>
        `;
    }

    function renderAbout() {
        return `
            <div class="hero">
                <h2>About Urdu Story Toons</h2>
                <p>We bring the power of AI to everyone. Create stunning images and videos for free.</p>
                <p style="margin-top:1rem">🎯 Mission: Make AI accessible to Urdu speaking creators</p>
                <p>📧 Contact: support@urdustorytoons.com</p>
                <p>▶ YouTube: @urdustorytoons007</p>
            </div>
        `;
    }

    function renderTool() {
        const tool = window.activeTool;
        if(tool === 'text2image') {
            return `
                <div class="tool-area">
                    <div class="flex-between"><h2>🎨 Text to Image Generator</h2><button class="btn" onclick="showPage('tools')">← Back</button></div>
                    <textarea id="imgPrompt" rows="4" placeholder="Describe your image...&#10;Example: A beautiful mountain sunset, cinematic, 4K"></textarea>
                    <button class="btn btn-primary" onclick="generateImage()">✨ Generate Image</button>
                    <div class="result-area" id="imageResult"></div>
                </div>
            `;
        } else {
            return `
                <div class="tool-area">
                    <div class="flex-between"><h2>🎬 Image to Video Generator</h2><button class="btn" onclick="showPage('tools')">← Back</button></div>
                    <div class="upload-area" onclick="document.getElementById('videoImageInput').click()">
                        <i class="fas fa-cloud-upload-alt fa-2x"></i><br>Click to upload an image
                    </div>
                    <input type="file" id="videoImageInput" accept="image/*" style="display:none" onchange="handleVideoImageUpload(event)">
                    <div id="videoPreview"></div>
                    <textarea id="videoPrompt" rows="3" placeholder="Describe the motion...&#10;Example: slow cinematic zoom in, dramatic lighting"></textarea>
                    <button class="btn btn-primary" onclick="generateVideo()">🎥 Generate 6-Second Video</button>
                    <div class="result-area" id="videoResult"></div>
                </div>
            `;
        }
    }

    // ---------- PAGE NAVIGATION ----------
    window.showPage = function(page) {
        currentPage = page;
        if(page === 'tool') return;
        window.activeTool = null;
        render();
    }

    window.openTool = function(tool) {
        if(!currentUser) { alert('Please sign in first'); openAuthModal(); return; }
        window.activeTool = tool;
        currentPage = 'tool';
        render();
    }

    // ---------- TEXT TO IMAGE ----------
    window.generateImage = async function() {
        const prompt = document.getElementById('imgPrompt')?.value;
        if(!prompt) { alert('Please enter a prompt'); return; }
        
        showLoading('Generating your image...');
        updateProgress(30);
        
        try {
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
            updateProgress(80);
            await new Promise(r => setTimeout(r, 500));
            
            const resultDiv = document.getElementById('imageResult');
            resultDiv.innerHTML = `
                <img src="${url}" class="result-img" style="max-width:100%; border-radius:20px;">
                <div class="flex-between gap-2 mt-2" style="justify-content:center">
                    <button class="btn" onclick="window.open('${url}', '_blank')"><i class="fas fa-download"></i> Download</button>
                </div>
            `;
            
            history.unshift({ type: 'image', tool: 'Text to Image', prompt, url, userEmail: currentUser.email, date: new Date().toISOString() });
            history = history.slice(0, 100);
            localStorage.setItem('history', JSON.stringify(history));
            updateProgress(100);
            setTimeout(hideLoading, 500);
        } catch(e) {
            hideLoading();
            alert('Error: ' + e.message);
        }
    }

    // ---------- IMAGE TO VIDEO ----------

        const file = event.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                upl
