<!DOCTYPE html>
<html>
<head>
    <title>Urdu Story Toons - AI Studio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #1a1a3e);
            margin: 0;
            padding: 20px;
            color: white;
            text-align: center;
        }
        .box {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            margin: 15px auto;
            max-width: 500px;
        }
        input, button {
            padding: 12px;
            margin: 5px;
            border-radius: 25px;
            border: none;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .tool {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin: 15px auto;
            cursor: pointer;
            max-width: 300px;
            display: inline-block;
            width: 90%;
        }
        .tool:hover {
            background: rgba(255,255,255,0.2);
        }
        .tools {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
        }
        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
        }
        .preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 10px;
        }
        .progress {
            height: 3px;
            background: #333;
            margin: 10px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #667eea;
        }
        .size-row {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .size-btn {
            background: #333;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .size-btn.active {
            background: #667eea;
        }
        video, img {
            max-width: 100%;
            border-radius: 10px;
        }
        .youtube {
            background: #ff0000;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<h1>🎬 Urdu Story Toons</h1>

<div class="box">
    <input type="email" id="email" placeholder="Enter your email">
    <button onclick="doLogin()">Sign In (Free)</button>
    <span id="userMsg"></span>
</div>

<div class="tools">
    <div class="tool" onclick="openTTS()">
        <h2>🎙️ Text to Voice</h2>
        <p>30+ realistic voices</p>
    </div>
    <div class="tool" onclick="openImageTool()">
        <h2>🎨 Text to Image</h2>
        <p>4K HD • 1:1, 16:9, 9:16</p>
    </div>
    <div class="tool" onclick="openVideoTool()">
        <h2>🎬 Image to Video</h2>
        <p>Real motion • 3 Sizes</p>
    </div>
</div>

<div>
    <a href="https://youtube.com/@urdustorytoons007" target="_blank" class="youtube">▶️ Subscribe on YouTube</a>
</div>

<p style="color:#888; margin-top:30px;">© 2026 Urdu Story Toons | Free & Unlimited | Sizes: 9:16 (Shorts) • 16:9 (YouTube) • 1:1 (Instagram)</p>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    let loggedIn = false;
    let userName = "";
    
    function doLogin() {
        let email = document.getElementById('email').value.trim();
        if(email === "") {
            alert("Enter email!");
            return;
        }
        if(!email.includes('@')) {
            alert("Valid email required!");
            return;
        }
        loggedIn = true;
        userName = email.split('@')[0];
        localStorage.setItem('ust_user', userName);
        document.getElementById('email').style.display = 'none';
        document.querySelector('.box button').style.display = 'none';
        document.getElementById('userMsg').innerHTML = '✅ Welcome ' + userName;
        alert("Welcome! All tools FREE!");
    }
    
    function checkLogin() {
        if(!loggedIn) {
            alert("Please sign in first!");
            return false;
        }
        return true;
    }
    
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }
    
    // ========== TEXT TO VOICE ==========
    function openTTS() {
        if(!checkLogin()) return;
        document.getElementById('modalTitle').innerHTML = '🎙️ Text to Voice';
        document.getElementById('modalBody').innerHTML = `
            <textarea id="ttsText" rows="3" placeholder="Enter text..."></textarea>
            <select id="voiceSelect" style="width:100%; padding:10px;">
                <option>👩 Sarah (Female)</option><option>👩 Emma (Female)</option>
                <option>👩 Olivia (Female)</option><option>👨 Michael (Male)</option>
                <option>👨 David (Male)</option><option>👨 James (Male)</option>
            </select>
            <div class="progress"><div class="progress-fill" id="ttsP"></div></div>
            <button onclick="genTTS()" style="width:100%;">Generate Voice</button>
            <div id="ttsR"></div>
        `;
        document.getElementById('modal').style.display = 'flex';
    }
    
    function genTTS() {
        let text = document.getElementById('ttsText').value;
        if(!text.trim()) { alert("Enter text!"); return; }
        let prog = document.getElementById('ttsP');
        prog.style.width = '100%';
        let speech = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(speech);
        document.getElementById('ttsR').innerHTML = '<p style="color:#10b981;">✅ Playing!</p>';
        setTimeout(() => prog.style.width = '0%', 1000);
    }
    
    // ========== TEXT TO IMAGE ==========
    let imgW = 1024, imgH = 1024;
    let imgName = "1:1 (Instagram)";
    
    function openImageTool() {
        if(!checkLogin()) return;
        document.getElementById('modalTitle').innerHTML = '🎨 Text to Image';
        document.getElementById('modalBody').innerHTML = `
            <div class="size-row">
                <div class="size-btn" onclick="setImgSize(1024,1024,'1:1 (Instagram)',this)">📐 1:1 Instagram</div>
                <div class="size-btn" onclick="setImgSize(1920,1080,'16:9 (YouTube)',this)">📺 16:9 YouTube</div>
                <div class="size-btn" onclick="setImgSize(1080,1920,'9:16 (Shorts)',this)">📱 9:16 Shorts</div>
            </div>
            <textarea id="imgPrompt" rows="3" placeholder="Describe image... Example: warrior on horse, sunset, cinematic"></textarea>
            <div class="progress"><div class="progress-fill" id="imgP"></div></div>
            <button onclick="genImage()" style="width:100%;">✨ Generate ${imgName}</button>
            <div id="imgR"></div>
        `;
        document.getElementById('modal').style.display = 'flex';
    }
    
    function setImgSize(w, h, name, el) {
        imgW = w; imgH = h; imgName = name;
        document.querySelectorAll('#modalBody .size-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }
    
    async function genImage() {
        let prompt = document.getElementById('imgPrompt').value;
        if(!prompt.trim()) { alert("Enter prompt!"); return; }
        let prog = document.getElementById('imgP');
        let res = document.getElementById('imgR');
        prog.style.width = '50%';
        res.innerHTML = '<p>⏳ Generating...</p>';
        try {
            let url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=' + imgW + '&height=' + imgH + '&nologo=true';
            prog.style.width = '100%';
            res.innerHTML = '<img src="' + url + '"><br><button onclick="downloadImg(\'' + url + '\')" style="margin-top:10px;">💾 Download</button>';
            setTimeout(() => prog.style.width = '0%', 500);
        } catch(e) {
            res.innerHTML = '<p style="color:red;">Error!</p>';
            prog.style.width = '0%';
        }
    }
    
    function downloadImg(url) {
        let a = document.createElement('a');
        a.href = url;
        a.download = 'image.png';
        a.click();
    }
    
    // ========== IMAGE TO VIDEO ==========
    let vidW = 1080, vidH = 1920;
    let vidName = "9:16 (Shorts)";
    let uploadedImg = null;
    
    function openVideoTool() {
        if(!checkLogin()) return;
        document.getElementById('modalTitle').innerHTML = '🎬 Image to Video';
        document.getElementById('modalBody').innerHTML = `
            <div class="size-row">
                <div class="size-btn" onclick="setVidSize(1080,1920,'9:16 (Shorts)',this)">📱 9:16 Shorts</div>
                <div class="size-btn" onclick="setVidSize(1920,1080,'16:9 (YouTube)',this)">📺 16:9 YouTube</div>
                <div class="size-btn" onclick="setVidSize(1080,1080,'1:1 (Instagram)',this)">📐 1:1 Instagram</div>
            </div>
            <input type="file" id="vidFile" accept="image/*" onchange="previewVid()">
            <div id="vidPreview" style="margin:10px 0;"></div>
            <textarea id="vidPrompt" rows="3" placeholder="Motion: zoom in, zoom out, pan left, pan right, orbit"></textarea>
            <div class="progress"><div class="progress-fill" id="vidP"></div></div>
            <button onclick="genVideo()" style="width:100%;">🎥 Generate 6-Second Video (${vidName})</button>
            <div id="vidR"></div>
        `;
        document.getElementById('modal').style.display = 'flex';
    }
    
    function setVidSize(w, h, name, el) {
        vidW = w; vidH = h; vidName = name;
        document.querySelectorAll('#modalBody .size-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }
    
    function previewVid() {
        let file = document.getElementById('vidFile').files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                uploadedImg = e.target.result;
                document.getElementById('vidPreview').innerHTML = '<img src="' + uploadedImg + '"><p style="color:#10b981;">✅ Ready for ' + vidName + '</p>';
            };
            reader.readAsDataURL(file);
        }
    }
    
    async function genVideo() {
        let prompt = document.getElementById('vidPrompt').value;
        let prog = document.getElementById('vidP');
        let resDiv = document.getElementById('vidR');
        
        if(!uploadedImg) { alert("Upload image first!"); return; }
        
        prog.style.width = '20%';
        resDiv.innerHTML = '<p>⏳ Loading...</p>';
        
        let img = new Image();
        img.src = uploadedImg;
        await new Promise(r => { img.onload = r; });
        
        prog.style.width = '40%';
        resDiv.innerHTML = '<p>🎬 Creating 6-second video...</p>';
        
        let canvas = document.createElement('canvas');
        canvas.width = vidW;
        canvas.height = vidH;
        let ctx = canvas.getContext('2d');
        
        let dw, dh, sx, sy;
        if(img.width/img.height > vidW/vidH) {
            dh = vidH;
            dw = img.width * (vidH / img.height);
            sx = (vidW - dw) / 2;
            sy = 0;
        } else {
            dw = vidW;
            dh = img.height * (vidW / img.width);
            sx = 0;
            sy = (vidH - dh) / 2;
        }
        
        let stream = canvas.captureStream(24);
        let recorder = new MediaRecorder(stream);
        let chunks = [];
        
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            let blob = new Blob(chunks, { type: 'video/webm' });
            let url = URL.createObjectURL(blob);
            resDiv.innerHTML = '<video src="' + url + '" controls autoplay loop></video><br><button onclick="downloadVid(\'' + url + '\')" style="margin-top:10px; background:#10b981;">💾 Download</button>';
            prog.style.width = '0%';
        };
        
        recorder.start();
        let start = Date.now();
        let p = prompt.toLowerCase();
        
        function animate() {
            let elapsed = (Date.now() - start) / 1000;
            let progVal = Math.min(elapsed / 6, 1);
            if(progVal >= 1) { recorder.stop(); return; }
            
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, vidW, vidH);
            
            let scale = 1;
            let x = sx, y = sy;
            
            if(p.includes('zoom in')) {
                scale = 1 + progVal * 0.25;
                x = (vidW - dw * scale) / 2;
                y = (vidH - dh * scale) / 2;
            }
            else if(p.includes('pan left')) {
                let maxPan = dw - vidW;
                x = sx - maxPan * progVal;
            }
            else if(p.includes('pan right')) {
                let maxPan = dw - vidW;
                x = sx - maxPan * (1 - progVal);
            }
            else if(p.includes('orbit')) {
                scale = 1 + Math.sin(progVal * Math.PI) * 0.08;
                x = (vidW - dw * scale) / 2 + Math.sin(progVal * Math.PI * 2) * 40;
                y = (vidH - dh * scale) / 2;
            }
            else {
                scale = 1 + Math.sin(progVal * Math.PI * 2) * 0.02;
                x = (vidW - dw * scale) / 2;
                y = (vidH - dh * scale) / 2;
            }
            
            ctx.drawImage(img, x, y, dw * scale, dh * scale);
            ctx.font = '12px Arial';
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillText('Urdu Story Toons', vidW - 130, vidH - 10);
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    function downloadVid(url) {
        let a = document.createElement('a');
        a.href = url;
        a.download = 'video.webm';
        a.click();
    }
    
    // Load saved user
    let savedUser = localStorage.getItem('ust_user');
    if(savedUser) {
        loggedIn = true;
        userName = savedUser;
        document.getElementById('email').style.display = 'none';
        document.querySelector('.box button').style.display = 'none';
        document.getElementById('userMsg').innerHTML = '✅ Welcome ' + userName;
    }
</script>
</body>
</html>
