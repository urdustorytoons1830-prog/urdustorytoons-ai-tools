<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Story Toons - AI Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #1a1a3e);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .login-box {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .login-box input {
            padding: 10px;
            border-radius: 25px;
            border: none;
            width: 250px;
            margin-right: 10px;
        }
        .login-box button {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .tools {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .tool {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            color: white;
        }
        .tool:hover {
            background: rgba(255,255,255,0.2);
        }
        .tool-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e2e;
            max-width: 600px;
            width: 90%;
            border-radius: 20px;
            padding: 20px;
            color: white;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .close {
            font-size: 25px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .preview {
            text-align: center;
            margin: 10px 0;
        }
        .preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 10px;
        }
        video {
            max-width: 100%;
            border-radius: 10px;
        }
        .progress {
            height: 3px;
            background: #333;
            margin: 10px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #667eea;
        }
        .result {
            margin-top: 15px;
            text-align: center;
        }
        .youtube {
            text-align: center;
            margin: 20px 0;
        }
        .youtube a {
            background: #ff0000;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
        }
        footer {
            text-align: center;
            color: #888;
            margin-top: 30px;
        }
        .status {
            color: #10b981;
            margin-left: 10px;
        }
        .remaining {
            background: #10b981;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
        }
        .user-info {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 30px;
            margin-left: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Urdu Story Toons AI Studio</h1>

        <div class="login-box" id="loginBox">
            <input type="email" id="userEmail" placeholder="Enter your email">
            <button id="loginBtn">Sign In (Free)</button>
            <span id="loginStatus" class="status"></span>
            <span id="remainingBadge" class="remaining"></span>
        </div>

        <div class="tools">
            <div class="tool" id="ttsTool">
                <div class="tool-icon">🎙️</div>
                <h3>Text to Voice</h3>
                <p>30+ voices</p>
            </div>
            <div class="tool" id="imgTool">
                <div class="tool-icon">🎨</div>
                <h3>Text to Image</h3>
                <p>HD quality</p>
            </div>
            <div class="tool" id="vidTool">
                <div class="tool-icon">🎬</div>
                <h3>Image to Video</h3>
                <p>Real motion</p>
            </div>
        </div>

        <div class="youtube">
            <a href="https://youtube.com/@urdustorytoons007" target="_blank">▶️ Subscribe on YouTube</a>
        </div>

        <footer>
            <p>© 2026 Urdu Story Toons | 10 Free Videos Daily | Real AI Motion</p>
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tool</h2>
                <button class="close" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ========== USER SYSTEM ==========
        let loggedIn = false;
        let userEmail = "";
        let userPlan = "free";
        let dailyCount = 0;
        let lastDate = "";

        function saveUser() {
            localStorage.setItem('ust_user', JSON.stringify({
                email: userEmail,
                plan: userPlan,
                count: dailyCount,
                date: lastDate
            }));
        }

        function loadUser() {
            let saved = localStorage.getItem('ust_user');
            if(saved) {
                let data = JSON.parse(saved);
                userEmail = data.email;
                userPlan = data.plan;
                dailyCount = data.count;
                lastDate = data.date;
                let today = new Date().toDateString();
                if(lastDate !== today) {
                    dailyCount = 0;
                    lastDate = today;
                    saveUser();
                }
                loggedIn = true;
                updateUI();
            }
        }

        function updateUI() {
            if(loggedIn) {
                document.getElementById('loginBox').innerHTML = `
                    <span class="user-info">👤 ${userEmail.split('@')[0]}</span>
                    <span class="remaining">🎬 ${userPlan === 'free' ? (10 - dailyCount) + ' left today' : 'Unlimited'}</span>
                    <button onclick="logout()" style="background:#333; width:auto; padding:8px 15px;">Logout</button>
                `;
            }
        }

        function logout() {
            loggedIn = false;
            userEmail = "";
            localStorage.removeItem('ust_user');
            location.reload();
        }

        function signIn() {
            let email = document.getElementById('userEmail').value.trim();
            if(!email || !email.includes('@')) {
                alert("Enter valid email!");
                return;
            }
            loggedIn = true;
            userEmail = email;
            userPlan = "free";
            dailyCount = 0;
            lastDate = new Date().toDateString();
            saveUser();
            updateUI();
            alert("✅ Welcome! You get 10 FREE videos daily!");
        }

        function checkLimit() {
            if(userPlan === 'free' && dailyCount >= 10) {
                alert("❌ Daily limit reached! 10 free videos done.\nUpgrade for unlimited - $10/month");
                return false;
            }
            return true;
        }

        function addUsage() {
            if(userPlan === 'free') {
                dailyCount++;
                saveUser();
                updateUI();
            }
        }

        // ========== MODAL ==========
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // ========== TEXT TO VOICE ==========
        document.getElementById('ttsTool').onclick = function() {
            if(!loggedIn) { alert("Sign in first!"); return; }
            document.getElementById('modalTitle').innerHTML = '🎙️ Text to Voice (30 Voices)';
            let voicesHtml = '<select id="voiceSelect">';
            let female = ['Sarah','Emma','Olivia','Sophia','Isabella','Mia','Amelia','Harper','Evelyn','Abigail'];
            let male = ['Michael','David','James','John','Robert','William','Richard','Thomas','Christopher','Daniel','Matthew','Andrew','Joshua','Kevin','Brian','George','Edward','Ronald','Frank','Raymond'];
            for(let v of female) voicesHtml += `<option>👩 ${v}</option>`;
            for(let v of male) voicesHtml += `<option>👨 ${v}</option>`;
            voicesHtml += '</select>';
            document.getElementById('modalBody').innerHTML = `
                <textarea id="ttsText" rows="3" placeholder="Enter text..."></textarea>
                ${voicesHtml}
                <div class="progress"><div class="progress-fill" id="ttsProgress"></div></div>
                <button onclick="generateTTS()">🔊 Generate</button>
                <div id="ttsResult" class="result"></div>
            `;
            document.getElementById('modal').style.display = 'flex';
        };

        function generateTTS() {
            let text = document.getElementById('ttsText').value;
            if(!text.trim()) { alert("Enter text!"); return; }
            let prog = document.getElementById('ttsProgress');
            prog.style.width = '100%';
            let speech = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(speech);
            document.getElementById('ttsResult').innerHTML = '<p style="color:#10b981;">✅ Playing!</p>';
            setTimeout(() => { prog.style.width = '0%'; }, 1000);
        }

        // ========== TEXT TO IMAGE ==========
        document.getElementById('imgTool').onclick = function() {
            if(!loggedIn) { alert("Sign in first!"); return; }
            document.getElementById('modalTitle').innerHTML = '🎨 Text to Image';
            document.getElementById('modalBody').innerHTML = `
                <textarea id="imgPrompt" rows="3" placeholder="Describe image... Example: warrior on white horse, cinematic, 4K"></textarea>
                <div class="progress"><div class="progress-fill" id="imgProgress"></div></div>
                <button onclick="generateImage()">✨ Generate</button>
                <div id="imgResult" class="result"></div>
            `;
            document.getElementById('modal').style.display = 'flex';
        };

        async function generateImage() {
            let prompt = document.getElementById('imgPrompt').value;
            if(!prompt.trim()) { alert("Enter prompt!"); return; }
            let prog = document.getElementById('imgProgress');
            let res = document.getElementById('imgResult');
            prog.style.width = '50%';
            res.innerHTML = '<p>⏳ Generating...</p>';
            try {
                let url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt + ", high quality, 4K") + '?width=1024&height=1024';
                prog.style.width = '100%';
                res.innerHTML = '<img src="' + url + '" style="max-width:100%; border-radius:10px;"><br><button onclick="downloadImg(\'' + url + '\')" style="margin-top:10px;">💾 Download</button>';
                setTimeout(() => { prog.style.width = '0%'; }, 500);
            } catch(e) {
                res.innerHTML = '<p style="color:red;">Error!</p>';
                prog.style.width = '0%';
            }
        }

        function downloadImg(url) {
            let a = document.createElement('a');
            a.href = url;
            a.download = 'image.png';
            a.click();
        }

        // ========== IMAGE TO VIDEO (WORKING) ==========
        let uploadedImg = null;

        document.getElementById('vidTool').onclick = function() {
            if(!loggedIn) { alert("Sign in first!"); return; }
            if(!checkLimit()) return;
            document.getElementById('modalTitle').innerHTML = '🎬 Image to Video (Real Motion)';
            document.getElementById('modalBody').innerHTML = `
                <input type="file" id="videoFile" accept="image/*" onchange="previewVideo()">
                <div id="previewDiv" class="preview"></div>
                <textarea id="motionPrompt" rows="3" placeholder="Describe motion: zoom in, zoom out, pan left, pan right, orbit"></textarea>
                <div class="progress"><div class="progress-fill" id="videoProgress"></div></div>
                <button onclick="createWorkingVideo()">🎥 Generate Video</button>
                <div id="videoResult" class="result"></div>
                <p style="font-size:12px; color:#888; margin-top:10px;">✅ Real motion effects: zoom, pan, orbit!</p>
            `;
            document.getElementById('modal').style.display = 'flex';
        };

        function previewVideo() {
            let file = document.getElementById('videoFile').files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImg = e.target.result;
                    document.getElementById('previewDiv').innerHTML = '<img src="' + uploadedImg + '"><p style="color:#10b981;">✅ Image ready!</p>';
                };
                reader.readAsDataURL(file);
            }
        }

        async function createWorkingVideo() {
            let prompt = document.getElementById('motionPrompt').value;
            let prog = document.getElementById('videoProgress');
            let resDiv = document.getElementById('videoResult');

            if(!uploadedImg) { alert("Upload image first!"); return; }

            prog.style.width = '20%';
            resDiv.innerHTML = '<p>⏳ Loading...</p>';

            let img = new Image();
            img.src = uploadedImg;
            await new Promise(r => { img.onload = r; });

            prog.style.width = '40%';
            resDiv.innerHTML = '<p>🎬 Creating 6-second video...</p>';

            let canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 576;
            let ctx = canvas.getContext('2d');

            // Fit image
            let sw, sh, sx, sy;
            if(img.width/img.height > 1024/576) {
                sh = 576;
                sw = img.width * (576 / img.height);
                sx = (1024 - sw) / 2;
                sy = 0;
            } else {
                sw = 1024;
                sh = img.height * (1024 / img.width);
                sx = 0;
                sy = (576 - sh) / 2;
            }

            let stream = canvas.captureStream(24);
            let recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            let chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                addUsage();
                let blob = new Blob(chunks, { type: 'video/webm' });
                let url = URL.createObjectURL(blob);
                resDiv.innerHTML = `
                    <video src="${url}" controls autoplay loop style="max-width:100%; border-radius:10px;"></video>
                    <div style="margin-top:10px;">
                        <button onclick="downloadVideo('${url}')" style="background:#10b981;">💾 Download Video</button>
                    </div>
                `;
                prog.style.width = '0%';
            };

            recorder.start();
            let start = Date.now();
            let p = prompt.toLowerCase();

            function animate() {
                let elapsed = (Date.now() - start) / 1000;
                let progress = Math.min(elapsed / 6, 1);
                if(progress >= 1) {
                    recorder.stop();
                    return;
                }

                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, 1024, 576);

                let scale = 1;
                let x = sx, y = sy;

                if(p.includes('zoom in')) {
                    scale = 1 + progress * 0.25;
                    x = (1024 - sw * scale) / 2;
                    y = (576 - sh * scale) / 2;
                }
                else if(p.includes('zoom out')) {
                    scale = 1 + (1 - progress) * 0.2;
                    x = (1024 - sw * scale) / 2;
                    y = (576 - sh * scale) / 2;
                }
                else if(p.includes('pan left')) {
                    let maxPan = sw - 1024;
                    x = sx - maxPan * progress;
                }
                else if(p.includes('pan right')) {
                    let maxPan = sw - 1024;
                    x = sx - maxPan * (1 - progress);
                }
                else if(p.includes('orbit')) {
                    scale = 1 + Math.sin(progress * Math.PI) * 0.08;
                    x = (1024 - sw * scale) / 2 + Math.sin(progress * Math.PI * 2) * 50;
                    y = (576 - sh * scale) / 2;
                }
                else {
                    scale = 1 + Math.sin(progress * Math.PI * 2) * 0.02;
                    x = (1024 - sw * scale) / 2;
                    y = (576 - sh * scale) / 2;
                }

                ctx.drawImage(img, x, y, sw * scale, sh * scale);
                ctx.font = '14px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillText('Urdu Story Toons', 1024 - 140, 560);

                requestAnimationFrame(animate);
            }
            animate();
        }

        function downloadVideo(url) {
            let a = document.createElement('a');
            a.href = url;
            a.download = 'video.webm';
            a.click();
        }

        // ========== INIT ==========
        document.getElementById('loginBtn').onclick = signIn;
        loadUser();
    </script>
</body>
</html>
