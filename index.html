<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Story Toons - Video Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .login-area {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .login-area input {
            padding: 10px;
            border-radius: 25px;
            border: none;
            width: 250px;
            margin-right: 10px;
        }
        .login-area button {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .tools {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .tool {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            color: white;
        }
        .tool:hover {
            background: rgba(255,255,255,0.2);
        }
        .tool-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e2e;
            max-width: 600px;
            width: 90%;
            border-radius: 20px;
            padding: 20px;
            color: white;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .close {
            font-size: 25px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .preview {
            text-align: center;
            margin: 10px 0;
        }
        .preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 10px;
        }
        video {
            max-width: 100%;
            border-radius: 10px;
        }
        .progress {
            height: 3px;
            background: #333;
            margin: 10px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #667eea;
        }
        .result {
            margin-top: 15px;
            text-align: center;
        }
        .youtube {
            text-align: center;
            margin: 20px 0;
        }
        .youtube a {
            background: #ff0000;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
        }
        footer {
            text-align: center;
            color: #888;
            margin-top: 30px;
        }
        .status {
            color: #10b981;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Urdu Story Toons AI Studio</h1>

        <div class="login-area">
            <input type="text" id="userEmail" placeholder="Enter your email">
            <button id="loginBtn">Sign In (Free)</button>
            <span id="loginStatus" class="status"></span>
        </div>

        <div class="tools">
            <div class="tool" id="ttsTool">
                <div class="tool-icon">🎙️</div>
                <h3>Text to Voice</h3>
            </div>
            <div class="tool" id="imgTool">
                <div class="tool-icon">🎨</div>
                <h3>Text to Image</h3>
            </div>
            <div class="tool" id="vidTool">
                <div class="tool-icon">🎬</div>
                <h3>Image to Video</h3>
            </div>
        </div>

        <div class="youtube">
            <a href="https://youtube.com/@urdustorytoons007" target="_blank">▶️ Subscribe on YouTube</a>
        </div>

        <footer>
            <p>© 2026 Urdu Story Toons | Free & Unlimited</p>
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tool</h2>
                <button class="close" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Global variables
        let loggedIn = false;
        let userName = "";

        // DOM elements
        const loginBtn = document.getElementById('loginBtn');
        const userEmail = document.getElementById('userEmail');
        const loginStatus = document.getElementById('loginStatus');

        // SIGN IN FUNCTION
        loginBtn.onclick = function() {
            const email = userEmail.value.trim();
            if(email === "") {
                alert("Please enter your email!");
                return;
            }
            if(!email.includes('@')) {
                alert("Please enter a valid email!");
                return;
            }
            loggedIn = true;
            userName = email.split('@')[0];
            loginStatus.innerHTML = "✅ Welcome " + userName;
            userEmail.disabled = true;
            loginBtn.disabled = true;
            alert("✅ Welcome " + userName + "!\nAll tools are FREE & UNLIMITED!");
        };

        function checkLogin() {
            if(!loggedIn) {
                alert("Please Sign In first!");
                return false;
            }
            return true;
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // TEXT TO VOICE
        document.getElementById('ttsTool').onclick = function() {
            if(!checkLogin()) return;
            document.getElementById('modalTitle').innerHTML = '🎙️ Text to Voice';
            document.getElementById('modalBody').innerHTML = `
                <textarea id="ttsText" rows="3" placeholder="Enter your text here..."></textarea>
                <div class="progress"><div class="progress-fill" id="ttsProgress"></div></div>
                <button onclick="generateTTS()">🔊 Generate Voice</button>
                <div id="ttsResult" class="result"></div>
            `;
            document.getElementById('modal').style.display = 'flex';
        };

        function generateTTS() {
            let text = document.getElementById('ttsText').value;
            if(!text.trim()) { alert("Enter text!"); return; }
            let progress = document.getElementById('ttsProgress');
            progress.style.width = '100%';
            let speech = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(speech);
            document.getElementById('ttsResult').innerHTML = '<p style="color:#10b981;">✅ Voice playing!</p>';
            setTimeout(() => { progress.style.width = '0%'; }, 1000);
        }

        // TEXT TO IMAGE
        document.getElementById('imgTool').onclick = function() {
            if(!checkLogin()) return;
            document.getElementById('modalTitle').innerHTML = '🎨 Text to Image';
            document.getElementById('modalBody').innerHTML = `
                <textarea id="imgPrompt" rows="3" placeholder="Describe the image you want..."></textarea>
                <div class="progress"><div class="progress-fill" id="imgProgress"></div></div>
                <button onclick="generateImage()">✨ Generate Image</button>
                <div id="imgResult" class="result"></div>
            `;
            document.getElementById('modal').style.display = 'flex';
        };

        async function generateImage() {
            let prompt = document.getElementById('imgPrompt').value;
            if(!prompt.trim()) { alert("Enter prompt!"); return; }
            let progress = document.getElementById('imgProgress');
            let result = document.getElementById('imgResult');
            progress.style.width = '50%';
            result.innerHTML = '<p>⏳ Generating...</p>';
            try {
                let url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=1024&height=1024';
                progress.style.width = '100%';
                result.innerHTML = '<img src="' + url + '" style="max-width:100%; border-radius:10px;"><br><button onclick="downloadImage(\'' + url + '\')" style="margin-top:10px;">💾 Download</button>';
                setTimeout(() => { progress.style.width = '0%'; }, 500);
            } catch(e) {
                result.innerHTML = '<p style="color:red;">Error!</p>';
                progress.style.width = '0%';
            }
        }

        function downloadImage(url) {
            let a = document.createElement('a');
            a.href = url;
            a.download = 'image.png';
            a.click();
        }

        // IMAGE TO VIDEO - WORKING
        let uploadedImage = null;

        document.getElementById('vidTool').onclick = function() {
            if(!checkLogin()) return;
            document.getElementById('modalTitle').innerHTML = '🎬 Image to Video (6 Seconds)';
            document.getElementById('modalBody').innerHTML = `
                <input type="file" id="videoFile" accept="image/*" onchange="previewImage()">
                <div id="previewDiv" class="preview"></div>
                <textarea id="motionPrompt" rows="3" placeholder="Describe motion: zoom in, zoom out, pan left, pan right, orbit"></textarea>
                <div class="progress"><div class="progress-fill" id="videoProgress"></div></div>
                <button onclick="createVideo()">🎥 Generate 6-Second Video</button>
                <div id="videoResult" class="result"></div>
            `;
            document.getElementById('modal').style.display = 'flex';
        };

        function previewImage() {
            const file = document.getElementById('videoFile').files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage = e.target.result;
                    document.getElementById('previewDiv').innerHTML = '<img src="' + uploadedImage + '"><p>✅ Image ready!</p>';
                };
                reader.readAsDataURL(file);
            }
        }

        async function createVideo() {
            const prompt = document.getElementById('motionPrompt').value;
            const progress = document.getElementById('videoProgress');
            const resultDiv = document.getElementById('videoResult');

            if(!uploadedImage) {
                alert("Please upload an image first!");
                return;
            }

            progress.style.width = '20%';
            resultDiv.innerHTML = '<p>⏳ Loading image...</p>';

            const img = new Image();
            img.src = uploadedImage;
            
            await new Promise((resolve) => { img.onload = resolve; });

            progress.style.width = '40%';
            resultDiv.innerHTML = '<p>🎬 Creating 6-second video...</p>';

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 576;
            const ctx = canvas.getContext('2d');

            // Fit image
            let sw, sh, sx, sy;
            const imgRatio = img.width / img.height;
            const canRatio = 1024 / 576;
            
            if(imgRatio > canRatio) {
                sh = 576;
                sw = img.width * (576 / img.height);
                sx = (1024 - sw) / 2;
                sy = 0;
            } else {
                sw = 1024;
                sh = img.height * (1024 / img.width);
                sx = 0;
                sy = (576 - sh) / 2;
            }

            const stream = canvas.captureStream(24);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            let chunks = [];

            recorder.ondataavailable = (e) => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                resultDiv.innerHTML = `
                    <video src="${url}" controls autoplay loop style="max-width:100%; border-radius:10px;"></video>
                    <div style="margin-top:10px;">
                        <button onclick="downloadVideo('${url}')" style="background:#10b981;">💾 Download Video</button>
                    </div>
                `;
                progress.style.width = '0%';
            };

            recorder.start();
            
            const startTime = Date.now();
            const duration = 6;
            const p = prompt.toLowerCase();

            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                const prog = Math.min(elapsed / duration, 1);
                
                if(prog >= 1) {
                    recorder.stop();
                    return;
                }

                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, 1024, 576);
                
                let scale = 1;
                let x = sx, y = sy;
                
                if(p.includes('zoom in')) {
                    scale = 1 + prog * 0.2;
                    x = (1024 - sw * scale) / 2;
                    y = (576 - sh * scale) / 2;
                }
                else if(p.includes('zoom out')) {
                    scale = 1 + (1 - prog) * 0.2;
                    x = (1024 - sw * scale) / 2;
                    y = (576 - sh * scale) / 2;
                }
                else if(p.includes('pan left')) {
                    const maxPan = sw - 1024;
                    x = sx - maxPan * prog;
                    y = sy;
                }
                else if(p.includes('pan right')) {
                    const maxPan = sw - 1024;
                    x = sx - maxPan * (1 - prog);
                    y = sy;
                }
                else if(p.includes('orbit')) {
                    scale = 1 + Math.sin(prog * Math.PI) * 0.08;
                    x = (1024 - sw * scale) / 2 + Math.sin(prog * Math.PI * 2) * 40;
                    y = (576 - sh * scale) / 2;
                }
                else {
                    scale = 1 + Math.sin(prog * Math.PI * 2) * 0.02;
                    x = (1024 - sw * scale) / 2;
                    y = (576 - sh * scale) / 2;
                }

                ctx.drawImage(img, x, y, sw * scale, sh * scale);
                ctx.font = '14px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillText('Urdu Story Toons', 1024 - 140, 560);
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        function downloadVideo(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = 'video.webm';
            a.click();
        }
    </script>
</body>
</html>
