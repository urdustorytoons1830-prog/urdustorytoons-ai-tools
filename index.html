<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Story Toons - AI Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0f0f1a;
            color: #ffffff;
        }
        /* Navbar */
        .navbar {
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #2a2a3e;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: #2a2a3e;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #3b3b5e;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 70vh;
        }
        /* Cards */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.05));
            border-radius: 40px;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }
        .hero p {
            color: #94a3b8;
            font-size: 18px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }
        .tool-card {
            background: #1a1a2e;
            border-radius: 28px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #2a2a3e;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
            background: #1e1e35;
        }
        .tool-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        /* Tool Area */
        .tool-panel {
            background: #1a1a2e;
            border-radius: 32px;
            padding: 30px;
            border: 1px solid #2a2a3e;
        }
        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        textarea, input {
            width: 100%;
            padding: 14px;
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 20px;
            color: white;
            font-size: 15px;
            margin: 12px 0;
        }
        .upload-box {
            border: 2px dashed #3b3b5e;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin: 15px 0;
        }
        .upload-box:hover {
            border-color: #6366f1;
            background: rgba(99,102,241,0.05);
        }
        button {
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.97);
        }
        .result-box {
            margin-top: 25px;
            text-align: center;
        }
        .result-img, .result-video {
            max-width: 100%;
            border-radius: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #1a1a2e;
            border-radius: 32px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #6366f1;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #2a2a3e;
            color: #64748b;
        }
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-20 { margin-top: 20px; }
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
        }
        .history-item {
            background: #0f0f1a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
        }
        @media (max-width: 700px) {
            .navbar { flex-direction: column; }
            .hero h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">🎬 Urdu Story Toons</div>
    <div class="nav-buttons">
        <button class="nav-btn" onclick="showPage('home')">Home</button>
        <button class="nav-btn" onclick="showPage('tools')">Tools</button>
        <button class="nav-btn" onclick="showPage('dashboard')">Dashboard</button>
        <button class="nav-btn" onclick="showPage('about')">About</button>
        <button class="btn-outline" id="authButton" onclick="handleAuthClick()">Sign In</button>
    </div>
</div>

<div id="appContainer" class="container"></div>

<footer>
    <p>© 2026 Urdu Story Toons • Free AI Tools</p>
</footer>

<div id="authModal" class="modal">
    <div class="modal-box">
        <h3 style="margin-bottom:20px">Sign In / Sign Up</h3>
        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="text" id="loginName" placeholder="Your name (optional)">
        <button class="btn-primary" style="width:100%; margin:10px 0" onclick="handleLogin()">Continue</button>
        <button class="btn-outline" style="width:100%" onclick="closeAuthModal()">Cancel</button>
    </div>
</div>

<div id="loadingOverlay" class="loading">
    <div class="spinner"></div>
    <p style="margin-top:20px" id="loadingMsg">Processing...</p>
</div>

<script>
    // ---------- STORAGE ----------
    let currentUser = null;
    let users = [];
    let historyList = [];
    let currentPage = 'home';
    let activeTool = null;
    let uploadedImageData = null;

    // Load data
    function loadData() {
        try {
            users = JSON.parse(localStorage.getItem('ust_users') || '[]');
            historyList = JSON.parse(localStorage.getItem('ust_history') || '[]');
            const savedUser = localStorage.getItem('ust_currentUser');
            if(savedUser) currentUser = JSON.parse(savedUser);
        } catch(e) {}
        updateAuthButton();
    }

    function saveUsers() { localStorage.setItem('ust_users', JSON.stringify(users)); }
    function saveHistory() { localStorage.setItem('ust_history', JSON.stringify(historyList.slice(0, 100))); }
    function saveCurrentUser() { 
        if(currentUser) localStorage.setItem('ust_currentUser', JSON.stringify(currentUser));
        else localStorage.removeItem('ust_currentUser');
    }

    // Auth
    function updateAuthButton() {
        const btn = document.getElementById('authButton');
        if(btn) {
            if(currentUser) btn.innerText = `👤 ${currentUser.name || currentUser.email.split('@')[0]} | Logout`;
            else btn.innerText = 'Sign In';
        }
    }

    function handleAuthClick() {
        if(currentUser) {
            currentUser = null;
            saveCurrentUser();
            updateAuthButton();
            showPage('home');
        } else {
            openAuthModal();
        }
    }

    function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

    function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const name = document.getElementById('loginName').value.trim();
        if(!email) { alert('Please enter email'); return; }
        
        let user = users.find(u => u.email === email);
        if(!user) {
            user = { email, name: name || email.split('@')[0], joined: Date.now() };
            users.push(user);
            saveUsers();
        }
        currentUser = user;
        saveCurrentUser();
        updateAuthButton();
        closeAuthModal();
        showPage('dashboard');
    }

    // Loading
    function showLoading(msg) {
        document.getElementById('loadingMsg').innerText = msg || 'Processing...';
        document.getElementById('loadingOverlay').style.display = 'flex';
    }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

    // Navigation
    function showPage(page) {
        currentPage = page;
        activeTool = null;
        render();
    }

    function openTool(tool) {
        if(!currentUser) { alert('Please sign in first'); openAuthModal(); return; }
        activeTool = tool;
        currentPage = 'tool';
        render();
    }

    // Render Main
    function render() {
        const container = document.getElementById('appContainer');
        if(!container) return;
        
        if(currentPage === 'home') container.innerHTML = renderHome();
        else if(currentPage === 'tools') container.innerHTML = renderTools();
        else if(currentPage === 'dashboard') container.innerHTML = renderDashboard();
        else if(currentPage === 'about') container.innerHTML = renderAbout();
        else if(currentPage === 'tool') container.innerHTML = renderTool();
        else container.innerHTML = renderHome();
        
        // Attach tool events after render
        if(currentPage === 'tool' && activeTool === 'text2image') attachTextToImage();
        if(currentPage === 'tool' && activeTool === 'image2video') attachImageToVideo();
    }

    function renderHome() {
        return `
            <div class="hero">
                <h1>Welcome to <span style="color:#a855f7">Urdu Story Toons</span></h1>
                <p>AI-powered image and video generation • 100% Free</p>
            </div>
            <div class="tools-grid">
                <div class="tool-card" onclick="openTool('text2image')">
                    <div class="tool-icon">🎨</div>
                    <h3>Text to Image</h3>
                    <p style="color:#94a3b8; margin-top:8px">Generate stunning images from text</p>
                </div>
                <div class="tool-card" onclick="openTool('image2video')">
                    <div class="tool-icon">🎬</div>
                    <h3>Image to Video</h3>
                    <p style="color:#94a3b8; margin-top:8px">Upload image + prompt = animated video</p>
                </div>
            </div>
        `;
    }

    function renderTools() {
        return `
            <h2 style="margin-bottom:20px">AI Tools Studio</h2>
            <div class="tools-grid">
                <div class="tool-card" onclick="openTool('text2image')">
                    <div class="tool-icon">🎨</div>
                    <h3>Text to Image</h3>
                </div>
                <div class="tool-card" onclick="openTool('image2video')">
                    <div class="tool-icon">🎬</div>
                    <h3>Image to Video</h3>
                </div>
            </div>
        `;
    }

    function renderDashboard() {
        if(!currentUser) {
            return `<div class="hero"><p>Please sign in to view dashboard</p><button class="btn-primary" onclick="openAuthModal()">Sign In</button></div>`;
        }
        const userHistory = historyList.filter(h => h.userEmail === currentUser.email);
        const imgCount = userHistory.filter(h => h.type === 'image').length;
        const videoCount = userHistory.filter(h => h.type === 'video').length;
        
        return `
            <h2>Your Dashboard</h2>
            <div class="dashboard-stats">
                <div class="stat-card"><h3>🎨 ${imgCount}</h3><p>Images Created</p></div>
                <div class="stat-card"><h3>🎬 ${videoCount}</h3><p>Videos Created</p></div>
            </div>
            <h3>Recent Activity</h3>
            <div id="historyListDiv">
                ${userHistory.slice(0, 8).map(h => `
                    <div class="history-item">
                        <strong>${h.tool}</strong><br>
                        <small>${h.prompt?.substring(0, 60) || 'No prompt'}</small>
                        <div style="font-size:11px; color:#64748b; margin-top:5px">${new Date(h.date).toLocaleString()}</div>
                    </div>
                `).join('') || '<p>No activity yet. Try generating something!</p>'}
            </div>
        `;
    }

    function renderAbout() {
        return `
            <div class="hero">
                <h2>About Urdu Story Toons</h2>
                <p>We bring AI creativity to everyone. Generate images and videos for free.</p>
                <p style="margin-top:20px">📧 support@urdustorytoons.com</p>
                <p>▶️ YouTube: @urdustorytoons007</p>
            </div>
        `;
    }

    function renderTool() {
        if(activeTool === 'text2image') {
            return `
                <div class="tool-panel">
                    <div class="tool-header">
                        <h2>🎨 Text to Image Generator</h2>
                        <button class="btn-outline" onclick="showPage('tools')">← Back</button>
                    </div>
                    <textarea id="txtPrompt" rows="3" placeholder="Describe your image...&#10;Example: a majestic lion in sunset, cinematic 4K"></textarea>
                    <button class="btn-primary" id="doGenerateImage" style="width:100%">✨ Generate Image</button>
                    <div class="result-box" id="txtResult"></div>
                </div>
            `;
        } else {
            return `
                <div class="tool-panel">
                    <div class="tool-header">
                        <h2>🎬 Image to Video Generator</h2>
                        <button class="btn-outline" onclick="showPage('tools')">← Back</button>
                    </div>
                    <div class="upload-box" id="videoUploadBox">
                        📸 Click to upload an image
                    </div>
                    <input type="file" id="videoFileInput" accept="image/*" style="display:none">
                    <div id="videoPreviewDiv"></div>
                    <textarea id="vidPrompt" rows="3" placeholder="Describe motion...&#10;Example: slow cinematic zoom in with dramatic lighting"></textarea>
                    <button class="btn-primary" id="doGenerateVideo" style="width:100%">🎥 Generate 6-Second Video</button>
                    <div class="result-box" id="vidResult"></div>
                </div>
            `;
        }
    }

    // ---------- TEXT TO IMAGE ----------
    function attachTextToImage() {
        const btn = document.getElementById('doGenerateImage');
        if(btn) {
            btn.onclick = async () => {
                const prompt = document.getElementById('txtPrompt')?.value;
                if(!prompt) { alert('Please enter a prompt'); return; }
                showLoading('Generating your image...');
                try {
                    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
                    const resultDiv = document.getElementById('txtResult');
                    resultDiv.innerHTML = `<img src="${url}" class="result-img" style="max-width:100%; border-radius:20px;"><br><button class="btn-outline" style="margin-top:12px" onclick="window.open('${url}','_blank')">📥 Download</button>`;
                    
                    historyList.unshift({ type: 'image', tool: 'Text to Image', prompt, url, userEmail: currentUser.email, date: Date.now() });
                    saveHistory();
                    hideLoading();
                } catch(e) { hideLoading(); alert('Error: ' + e.message); }
            };
        }
    }

    // ---------- IMAGE TO VIDEO ----------
    function attachImageToVideo() {
        const uploadBox = document.getElementById('videoUploadBox');
        const fileInput = document.getElementById('videoFileInput');
        if(uploadBox && fileInput) {
            uploadBox.onclick = () => fileInput.click();
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        uploadedImageData = ev.target.result;
                        document.getElementById('videoPreviewDiv').innerHTML = `<img src="${uploadedImageData}" style="max-width:100%; border-radius:20px; margin-top:10px"><p style="color:#22c55e; margin-top:8px">✅ Image uploaded</p>`;
                    };
                    reader.readAsDataURL(file);
                }
            };
        }
        
        const genBtn = document.getElementById('doGenerateVideo');
        if(genBtn) {
            genBtn.onclick = async () => {
                const prompt = document.getElementById('vidPrompt')?.value;
                if(!uploadedImageData) { alert('Please upload an image first'); return; }
                if(!prompt) { alert('Please describe the motion'); return; }
                showLoading('Creating 6-second video...');
                
                try {
                    const img = new Image();
                    img.src = uploadedImageData;
                    await new Promise(r => { img.onload = r; });
                    
                    const canvas = document.createElement('canvas
