<!DOCTYPE html>
<html>
<head>
    <title>Urdu Story Toons - AI Tools</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .login-box {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .login-box input {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            width: 250px;
            margin-right: 10px;
        }
        .login-box button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .tool-card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .tool-card:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-5px);
        }
        .tool-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .tool-card h3 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e2e;
            max-width: 550px;
            width: 90%;
            border-radius: 25px;
            padding: 25px;
            color: white;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            font-size: 14px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0;
        }
        .result-area {
            margin-top: 20px;
            text-align: center;
        }
        .result-area img, .result-area video {
            max-width: 100%;
            border-radius: 15px;
        }
        .progress {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 15px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .user-badge {
            color: #667eea;
            font-weight: bold;
            margin-left: 10px;
        }
        footer {
            text-align: center;
            color: rgba(255,255,255,0.5);
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Urdu Story Toons AI Studio</h1>
            <p>Free AI Tools - No Limits, No Credits</p>
        </div>

        <div class="login-box">
            <input type="email" id="email" placeholder="Enter your email">
            <button onclick="login()">🔐 Sign In (Free)</button>
            <span id="userName" class="user-badge"></span>
        </div>

        <div class="tools-grid">
            <div class="tool-card" onclick="openTool('tts')">
                <div class="tool-icon">🎙️</div>
                <h3>Text to Voice</h3>
                <p>Convert text to natural speech</p>
            </div>
            <div class="tool-card" onclick="openTool('image')">
                <div class="tool-icon">🎨</div>
                <h3>Text to Image</h3>
                <p>Generate HD images from prompts</p>
            </div>
            <div class="tool-card" onclick="openTool('video')">
                <div class="tool-icon">🎬</div>
                <h3>Image to Video</h3>
                <p>Upload image + prompt = 6-sec video</p>
            </div>
        </div>

        <footer>
            <p>© 2026 Urdu Story Toons | Unlimited Free Access</p>
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tool</h2>
                <button class="close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let currentUser = "";

        function login() {
            let email = document.getElementById('email').value;
            if(email && email.includes('@')) {
                isLoggedIn = true;
                currentUser = email.split('@')[0];
                document.getElementById('userName').innerHTML = '👋 Hello, ' + currentUser;
                alert('✅ Welcome ' + currentUser + '! All tools are FREE & UNLIMITED!');
            } else {
                alert('❌ Please enter a valid email!');
            }
        }

        function checkLogin() {
            if(!isLoggedIn) {
                alert('🔐 Please sign in first using the email box above!');
                return false;
            }
            return true;
        }

        function openTool(tool) {
            if(!checkLogin()) return;
            
            let modal = document.getElementById('modal');
            let modalTitle = document.getElementById('modalTitle');
            let modalBody = document.getElementById('modalBody');
            
            if(tool === 'tts') {
                modalTitle.innerHTML = '🎙️ Text to Voice';
                modalBody.innerHTML = `
                    <textarea id="ttsText" rows="3" placeholder="Write anything... Example: Assalamualaikum, welcome to Urdu Story Toons"></textarea>
                    <div class="progress"><div class="progress-fill" id="ttsProgress"></div></div>
                    <button class="btn" onclick="generateTTS()">🔊 Generate & Play Voice</button>
                    <div id="ttsResult" class="result-area"></div>
                `;
            } else if(tool === 'image') {
                modalTitle.innerHTML = '🎨 Text to Image';
                modalBody.innerHTML = `
                    <textarea id="imgPrompt" rows="3" placeholder="Describe image... Example: A beautiful sunset over mountains with birds"></textarea>
                    <div class="progress"><div class="progress-fill" id="imgProgress"></div></div>
                    <button class="btn" onclick="generateImage()">✨ Generate HD Image</button>
                    <div id="imgResult" class="result-area"></div>
                `;
            } else if(tool === 'video') {
                modalTitle.innerHTML = '🎬 Image to Video';
                modalBody.innerHTML = `
                    <input type="file" id="videoImage" accept="image/*">
                    <textarea id="videoPrompt" rows="3" placeholder="Describe motion... Example: slow zoom in"></textarea>
                    <div class="progress"><div class="progress-fill" id="videoProgress"></div></div>
                    <button class="btn" onclick="generateVideo()">🎥 Generate 6-Second Video</button>
                    <div id="videoResult" class="result-area"></div>
                `;
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // TTS Function
        function generateTTS() {
            let text = document.getElementById('ttsText').value;
            let progress = document.getElementById('ttsProgress');
            let result = document.getElementById('ttsResult');
            
            if(!text.trim()) {
                alert('Please enter some text!');
                return;
            }
            
            progress.style.width = '100%';
            let speech = new SpeechSynthesisUtterance(text);
            speech.rate = 1;
            speech.pitch = 1;
            speechSynthesis.speak(speech);
            result.innerHTML = '<p style="color:#10b981;">✅ Voice is playing! Check your speakers.</p>';
            setTimeout(() => { progress.style.width = '0%'; }, 1000);
        }

        // Text to Image Function
        async function generateImage() {
            let prompt = document.getElementById('imgPrompt').value;
            let progress = document.getElementById('imgProgress');
            let result = document.getElementById('imgResult');
            
            if(!prompt.trim()) {
                alert('Please enter a prompt!');
                return;
            }
            
            progress.style.width = '50%';
            result.innerHTML = '<p>⏳ Generating image... (15 seconds)</p>';
            
            try {
                let url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=1024&height=1024&nologo=true';
                progress.style.width = '100%';
                result.innerHTML = '<img src="' + url + '"><br><button class="btn" onclick="downloadImage(\'' + url + '\')">💾 Download Image</button>';
                setTimeout(() => { progress.style.width = '0%'; }, 500);
            } catch(e) {
                result.innerHTML = '<p style="color:red;">❌ Error! Try again.</p>';
                progress.style.width = '0%';
            }
        }

        function downloadImage(url) {
            let a = document.createElement('a');
            a.href = url;
            a.download = 'urdustorytoons-image.png';
            a.click();
        }

        // Image to Video Function
        function generateVideo() {
            let fileInput = document.getElementById('videoImage');
            let prompt = document.getElementById('videoPrompt').value;
            let progress = document.getElementById('videoProgress');
            let result = document.getElementById('videoResult');
            
            if(!fileInput.files.length) {
                alert('Please upload an image first!');
                return;
            }
            
            progress.style.width = '30%';
            result.innerHTML = '<p>⏳ Creating 6-second video...</p>';
            
            let file = fileInput.files[0];
            let reader = new FileReader();
            
            reader.onload = function(ev) {
                let img = new Image();
                img.src = ev.target.result;
                img.onload = function() {
                    progress.style.width = '60%';
                    
                    let canvas = document.createElement('canvas');
                    canvas.width = 1024;
                    canvas.height = 576;
                    let ctx = canvas.getContext('2d');
                    
                    let stream = canvas.captureStream(24);
                    let recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    let chunks = [];
                    
                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        let blob = new Blob(chunks, { type: 'video/webm' });
                        let videoUrl = URL.createObjectURL(blob);
                        result.innerHTML = '<video src="' + videoUrl + '" controls autoplay loop style="max-width:100%; border-radius:15px;"></video><br><button class="btn" onclick="downloadVideo(\'' + videoUrl + '\')">💾 Download Video</button>';
                        progress.style.width = '0%';
                    };
                    
                    recorder.start();
                    let startTime = Date.now();
                    let duration = 6;
                    
                    let imgW = img.width, imgH = img.height;
                    let canvasW = canvas.width, canvasH = canvas.height;
                    let imgAspect = imgW / imgH;
                    let canvasAspect = canvasW / canvasH;
                    let drawW, drawH, startX, startY;
                    
                    if(imgAspect > canvasAspect) {
                        drawH = canvasH;
                        drawW = imgW * (canvasH / imgH);
                        startX = (canvasW - drawW) / 2;
                        startY = 0;
                    } else {
                        drawW = canvasW;
                        drawH = imgH * (canvasW / imgW);
                        startX = 0;
                        startY = (canvasH - drawH) / 2;
                    }
                    
                    function animate() {
                        let elapsed = (Date.now() - startTime) / 1000;
                        if(elapsed >= duration) {
                            recorder.stop();
                            return;
                        }
                        
                        ctx.fillStyle = '#000';
                        ctx.fillRect(0, 0, canvasW, canvasH);
                        
                        let scale = 1 + (elapsed / duration) * 0.15;
                        let offsetX = (canvasW - drawW * scale) / 2;
                        let offsetY = (canvasH - drawH * scale) / 2;
                        
                        ctx.drawImage(img, offsetX, offsetY, drawW * scale, drawH * scale);
                        ctx.font = '16px Arial';
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.fillText('Urdu Story Toons', canvasW - 150, canvasH - 15);
                        
                        requestAnimationFrame(animate);
                    }
                    animate();
                };
            };
            reader.readAsDataURL(file);
        }

        function downloadVideo(url) {
            let a = document.createElement('a');
            a.href = url;
            a.download = 'urdustorytoons-video.webm';
            a.click();
        }

        // Click outside to close modal
        window.onclick = function(e) {
            let modal = document.getElementById('modal');
            if(e.target === modal) closeModal();
        }
    </script>
</body>
</html>
