<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Story Toons - AI Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin: 15px 0;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Urdu Story Toons AI Tools</h1>
        <p style="text-align:center; color:#666;">Text to Image Generator</p>
        
        <textarea id="prompt" rows="3" placeholder="Describe your image... Example: A beautiful sunset over mountains"></textarea>
        <button onclick="generateImage()">✨ Generate Image</button>
        <div class="loading" id="loading">⏳ Generating your image... Please wait (10-20 seconds)</div>
        <img id="result" style="display:none;">
    </div>

    <script>
        // ⚠️ YAHAN APNA TOKEN LAGAYEIN ⚠️
        const HF_TOKEN = "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";
        
        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const img = document.getElementById('result');
            const loading = document.getElementById('loading');
            
            if (!prompt.trim()) {
                alert('Please enter a prompt!');
                return;
            }
            
            if (HF_TOKEN === "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") {
                alert('⚠️ API token not configured. Please contact support.');
                return;
            }
            
            loading.style.display = 'block';
            img.style.display = 'none';
            
            try {
                const response = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${HF_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inputs: prompt })
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                img.src = url;
                img.style.display = 'block';
                
            } catch (error) {
                alert('Error: ' + error.message + '. Try again.');
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
